services:
  hangong-redis:
    image: redis:7-alpine
    container_name: hangong-redis
    restart: unless-stopped

  hangong-worker:
    build: .
    container_name: hangong-worker
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    environment:
      REDIS_URL: redis://hangong-redis:6379/0
      DB_PATH: hangong.db
    volumes:
      - /opt/hangong/main.py:/app/main.py
      - /opt/hangong/ocr_handler.py:/app/ocr_handler.py
      - /opt/hangong/app:/app/app
      - /data/hangong/uploads:/app/uploads
      - /data/hangong/shiti:/app/shiti
      - /data/hangong/hangong.db:/app/hangong.db
    depends_on:
      - hangong-redis
    restart: unless-stopped

  hangong-app:
    build: .
    container_name: hangong-app
    ports:
      - "9000:8000"
    environment:
      HANGONG_SECRET_KEY: ${HANGONG_SECRET_KEY:?Set HANGONG_SECRET_KEY in .env}
      REDIS_URL: redis://hangong-redis:6379/0
      DB_PATH: hangong.db
    volumes:
      - /opt/hangong/main.py:/app/main.py
      - /opt/hangong/ocr_handler.py:/app/ocr_handler.py
      - /opt/hangong/start_server.py:/app/start_server.py
      - /opt/hangong/app:/app/app
      - /opt/hangong/static:/app/static
      - /opt/hangong/templates:/app/templates
      - /data/hangong/uploads:/app/uploads
      - /data/hangong/shiti:/app/shiti
      - /data/hangong/hangong.db:/app/hangong.db
    depends_on:
      - hangong-redis
      - hangong-worker
    restart: unless-stopped
