<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>培训信息录入系统 - 个人信息录入</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1.0.6">
  <link rel="stylesheet" href="/static/css/mobile-app.css?v=1.0.0">
  <style>
    /* 客户端页面特定样式微调 */
    .user-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      padding: 12px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .user-info-bar span {
      color: var(--text-muted);
    }
    .user-info-bar strong {
      color: var(--text-main);
    }
    .user-info-bar .btn-logout {
      background: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      padding: 4px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .user-info-bar .btn-logout:hover {
      background: var(--danger-color);
      color: white;
    }
    .form-container {
      max-width: 650px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
      width: 32px;
      height: 32px;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    /* 覆盖原照片位样式，使其为竖向 3:4 比例，且显示完整 */
    .photo-uploader {
      width: 180px;
      height: 240px;
      margin: 0 auto 25px auto; /* 居中 */
    }
    .photo-preview {
      object-fit: contain;
      background-color: rgba(0, 0, 0, 0.4);
    }
    .photo-uploader-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(6px, 2vw, 14px);
      align-items: start;
    }
    .photo-uploader-row .photo-uploader {
      width: 100%;
      min-width: 0;
      height: clamp(132px, 34vw, 220px);
      margin: 0;
    }
    .photo-uploader { position: relative; }
    .photo-source-menu {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 12;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      background: rgba(20, 24, 32, 0.94);
      border-radius: 10px;
      box-sizing: border-box;
    }
    .photo-source-menu.is-open { display: flex; }
    .photo-source-menu button {
      flex: 1;
      min-height: 36px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 7px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: clamp(.68rem, 2.7vw, .86rem);
      cursor: pointer;
    }
    .multi-photo-preview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
      height: 100%;
      padding: 8px;
      overflow-y: auto;
      position: absolute;
      inset: 0;
      z-index: 2;
      background: rgba(0, 0, 0, 0.18);
    }
    .multi-photo-preview:empty { display: none; }
    .multi-photo-thumbnail { position: relative; min-height: 82px; }
    .multi-photo-thumbnail img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; }
    .multi-photo-remove {
      position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; padding: 0;
      border: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.72); color: #fff; cursor: pointer;
    }
    .history-photo-gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(64px, 1fr));
      gap: 6px;
      min-width: 300px;
    }
    .history-photo-item {
      min-width: 0;
      padding: 4px;
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.025);
    }
    .history-photo-label { display: block; margin-bottom: 3px; color: var(--text-muted); font-size: 0.7rem; text-align: center; }
    .history-photo-images { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
    .history-photo-images:has(> :only-child) { grid-template-columns: 1fr; }
    .history-photo-button { min-width: 0; aspect-ratio: 3 / 4; padding: 0; overflow: hidden; border: 0; border-radius: 5px; background: rgba(0, 0, 0, 0.22); cursor: pointer; }
    .history-photo-button img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .history-photo-empty { display: flex; align-items: center; justify-content: center; min-height: 72px; color: var(--text-muted); font-size: 0.72rem; text-align: center; }
    .history-details-cell { vertical-align: middle; }
    .history-details-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px 9px;
      min-width: 480px;
    }
    .history-info-item { display: flex; align-items: center; min-width: 0; gap: 3px; line-height: 1.2; font-size: 0.76rem; }
    .history-info-label { flex: 0 0 auto; color: var(--text-muted); }
    .history-info-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); }
    .history-info-name { font-weight: 700; font-size: 0.84rem; }
    .history-readonly-badge { flex: 0 0 auto; padding: 1px 4px; border-radius: 4px; color: #667085; background: #eef1f5; font-size: 0.62rem; line-height: 1.2; }
    .history-readonly-note { color: var(--text-muted); font-size: 0.72rem; white-space: nowrap; }
    .history-info-id { font-family: monospace; }
    .history-info-address { grid-column: 1 / -1; align-items: flex-start; }
    .history-info-address .history-info-value { white-space: normal; word-break: break-all; }
    .history-exit-control { display:flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap; }
    .history-exit-date { width:118px; height:29px; padding:3px 5px; font-size:.74rem; }
    .form-control.field-missing { border-color:#f87171 !important; box-shadow:0 0 0 2px rgba(248,113,113,.18); }
    #image-modal { z-index: 3000; }
    .client-detail-card { width:min(900px, calc(100vw - 24px)); max-height:88vh; overflow-y:auto; margin:0; padding:16px; border:1px solid var(--glass-border); border-radius:12px; background:#1e293b; box-shadow:0 18px 50px rgba(0,0,0,.45); }
    .client-detail-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .client-detail-head h3 { margin:0; font-size:1rem; }
    .client-detail-close { width:auto; min-width:60px; margin:0; padding:6px 10px; }
    .client-detail-status, .client-detail-fields { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:6px; }
    .client-detail-status { margin-bottom:10px; }
    .client-detail-status-item, .client-detail-field { min-width:0; padding:6px 7px; border:1px solid var(--glass-border); border-radius:7px; background:rgba(255,255,255,.025); }
    .client-detail-status-item span, .client-detail-field span { display:block; color:var(--text-muted); font-size:.66rem; }
    .client-detail-status-item strong, .client-detail-field strong { display:block; overflow:hidden; margin-top:2px; font-size:.76rem; line-height:1.25; text-overflow:ellipsis; white-space:nowrap; }
    .client-detail-field.wide { grid-column:span 2; }
    .client-detail-photo-grid, .client-detail-assessment-grid { display:grid; gap:6px; margin-bottom:9px; }
    .client-detail-photo-grid { grid-template-columns:repeat(4, minmax(0, 1fr)); }
    .client-detail-assessment-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .client-detail-photo-group { min-width:0; padding:4px; border:1px solid var(--glass-border); border-radius:8px; background:rgba(255,255,255,.025); }
    .client-detail-photo-label { display:block; margin-bottom:3px; color:var(--text-muted); font-size:.68rem; text-align:center; }
    .client-detail-photo-images { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:4px; }
    .client-detail-photo-images:has(> :only-child) { grid-template-columns:1fr; }
    .client-detail-photo-button { min-width:0; aspect-ratio:3 / 4; padding:0; overflow:hidden; border:0; border-radius:5px; background:rgba(0,0,0,.25); cursor:zoom-in; }
    .client-detail-photo-button img { display:block; width:100%; height:100%; object-fit:cover; }
    .client-detail-photo-empty { display:flex; align-items:center; justify-content:center; min-height:64px; color:var(--text-muted); font-size:.68rem; }
    /* 录入表单使用更紧凑的行距，保留移动端触控高度。 */
    #form-record .form-group { margin-bottom:8px; }
    #form-record .form-grid { gap:8px 10px !important; }
    #form-record .form-control { min-height:36px; height:36px; padding:6px 9px; line-height:1.2; }
    #form-record label { margin-bottom:3px; font-size:.82rem; line-height:1.1; }
    #form-record .photo-uploader-row { margin-bottom:4px; }
    @media (max-width:768px) {
      /* 覆盖通用移动端 App 样式，录入表单保持高信息密度。 */
      #form-record .form-group { margin-bottom:7px !important; }
      #form-record .form-grid { gap:7px 8px !important; }
      #form-record .form-control { min-height:38px !important; height:38px !important; padding:5px 8px !important; font-size:.86rem !important; }
      #form-record label { margin-bottom:2px !important; font-size:.74rem !important; line-height:1.1 !important; }
    }
    @media (max-width: 640px) {
      .photo-uploader-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .photo-uploader-row .photo-uploader { width: 100% !important; height: clamp(128px, 42vw, 200px) !important; margin: 0 !important; }
      .photo-uploader-placeholder { padding: 4px; font-size: 0.7rem; text-align: center; }
      .photo-uploader-placeholder svg { width: 30px; height: 30px; margin-bottom: 6px; }
      .multi-photo-preview { grid-template-columns: 1fr; gap: 4px; padding: 5px; }
      .multi-photo-thumbnail { min-height: 52px; }
    }

    /* 页签导航 */
    .admin-nav {
      display: flex;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 20px;
      gap: 10px;
      width: 100%;
      max-width: 650px;
    }
    .admin-nav-item {
      padding: 12px 20px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .admin-nav-item.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    /* 移动端专有优化：彻底改用现代卡片式流布局 */
    @media (max-width: 768px) {
      /* 表单网格在小屏幕下保持双列展示 */
      .form-grid {
        grid-template-columns: 1fr 1fr !important;
        gap: 10px !important;
      }

      /* 头部个人信息条移动端：同一行横排紧凑显示 */
      .user-info-bar {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        justify-content: center;
        padding: 10px 12px;
        font-size: 0.8rem;
      }
      .user-info-bar div {
        display: inline;
        font-size: 0.8rem;
      }
      .user-info-bar div span {
        margin-left: 0;
      }
      .user-info-bar .btn-logout {
        width: auto;
        padding: 4px 10px;
        font-size: 0.78rem;
      }

      /* 移动端导航标签平分宽度，更加显眼 */
      .admin-nav {
        justify-content: space-around;
        gap: 0;
      }
      .admin-nav-item {
        padding: 10px 0;
        flex: 1;
        text-align: center;
        font-size: 0.9rem;
      }

      /* 移动端搜索栏纵向堆叠并拉满 */
      #tab-content-history > .glass-container > div[style*="display: flex"] {
        flex-direction: column;
        align-items: stretch !important;
        gap: 8px !important;
      }
      #history-search-name {
        width: 100% !important;
        box-sizing: border-box;
      }
      #tab-content-history button {
        width: 100% !important;
      }
      #tab-content-history > .glass-container { padding: 12px !important; }
      #tab-content-history > .glass-container h2 { margin-bottom: 3px; font-size: 1.08rem; }
      #tab-content-history > .glass-container .subtitle { margin: 0 0 8px; font-size: .74rem; line-height: 1.3; }
      #tab-content-history > .glass-container > div[style*="display: flex"] { margin-bottom: 9px !important; gap: 5px !important; }
      #tab-content-history > .glass-container > div[style*="display: flex"] button { min-height: 32px; padding: 6px 9px !important; font-size: .76rem; }

      /* 彻底隐藏表格头部 */
      .table-wrapper table thead {
        display: none !important;
      }

      /* 消除表格的横向滚动，转换为卡片布局 */
      .table-wrapper {
        overflow-x: visible !important;
        border: none !important;
        background: transparent !important;
      }
      .table-wrapper table {
        display: block !important;
        width: 100% !important;
        border: none !important;
      }
      .table-wrapper tbody {
        display: flex !important;
        flex-direction: column;
        gap: 6px;
      }
      .table-wrapper tr {
        display: block !important;
        background: rgba(255, 255, 255, 0.02) !important;
        border: 1px solid var(--glass-border) !important;
        border-radius: 9px !important;
        padding: 8px !important;
        margin-bottom: 0 !important;
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.1);
        position: relative !important;
        overflow: hidden;
      }
      .table-wrapper tr.downloaded-row {
        opacity: 0.65;
        background: rgba(255, 255, 255, 0.01) !important;
      }
      .table-wrapper td {
        display: block !important;
        border: none !important;
        padding: 2px 0 !important;
        text-align: left !important;
        white-space: normal !important;
        font-size: 0.85rem !important;
        width: 100% !important;
      }

      /* 卡片式结构定制：历史记录照片绝对定位到卡片右上角 */
      #history-table-body td.history-photo-cell {
        position: static;
        width: 100% !important;
        height: auto !important;
        padding: 0 0 5px !important;
        display: block !important;
        background: transparent !important;
      }
      
      .table-img {
        width: 50px !important;
        height: 66px !important;
        border-radius: 4px;
        border: 1px solid var(--glass-border);
      }

      /* 卡片式结构定制：文字信息列在右侧留白，防止遮挡 */
      #history-table-body td.history-details-cell {
        padding-right: 0 !important;
      }

      /* 历史记录卡片：操作按钮在卡片底部排开 */
      #history-table-body td:last-child {
        display: block !important;
        width: 100% !important;
        border-top: 1px dashed rgba(255, 255, 255, 0.08) !important;
        margin-top: 5px;
        padding-top: 7px !important;
        text-align: left !important;
      }
      #history-table-body td:last-child div {
        justify-content: flex-start !important;
      }
      #history-table-body td:last-child button,
      #history-table-body td:last-child a {
        flex: 1;
        text-align: center;
      }
      #history-table-body td:last-child .history-record-actions { justify-content: center !important; }
      #history-table-body td:last-child .history-card-action-button { flex: 0 0 auto !important; width: 67px !important; min-width: 0 !important; padding: 4px 6px !important; font-size: .72rem !important; }
      #history-table-body td.history-select-cell {
        display: inline-block !important;
        width: auto !important;
        margin-bottom: 4px;
        padding: 0 !important;
      }
      .history-checkbox { width: 18px !important; height: 18px !important; }
      .history-photo-gallery { min-width: 0; gap: 3px; }
      .history-photo-item { padding: 2px; border-radius: 5px; }
      .history-photo-label { font-size: 0.58rem; margin-bottom: 2px; line-height: 1.1; }
      .history-photo-images { gap: 2px; }
      .history-photo-empty { min-height: 40px; font-size: 0.56rem; }
      .history-details-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; min-width: 0; gap: 2px 4px; }
      .history-info-item { gap: 1px; min-height: 14px; font-size: 0.6rem; line-height: 1.03; }
      .history-info-name { font-size: 0.68rem; }
      .history-info-id, .history-info-address { grid-column: auto; align-items: center; }
      .history-info-address .history-info-value { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .client-detail-card { width:calc(100vw - 18px); max-height:92vh; padding:12px; }
      .client-detail-status, .client-detail-fields { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:5px; }
      .client-detail-status-item, .client-detail-field { padding:5px 6px; }
      .client-detail-field.wide { grid-column:span 2; }
      .client-detail-photo-grid { gap:3px; }
      .client-detail-assessment-grid { grid-template-columns:repeat(4, minmax(0, 1fr)); gap:3px; }
      .client-detail-photo-group { padding:3px; }
      .client-detail-photo-label { font-size:.58rem; }
      .client-detail-photo-images { gap:2px; }
      .client-detail-photo-empty { min-height:46px; font-size:.58rem; }
    }

    /* 提示信息过渡 */
    .alert {
      transition: opacity 0.5s ease;
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- App 顶部 Header（仅手机端显示） -->
  <header class="app-header">
    <div class="app-header-title">
      <span class="app-page-name" id="app-page-name">信息录入</span>
      <span class="app-user-name" id="app-user-name">--</span>
    </div>
    <div class="app-header-actions">
      <button class="app-icon-btn" onclick="logout()" aria-label="退出登录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- App 内容主区域 -->
  <main class="app-content">

  <!-- 用户信息条 -->
  <div class="user-info-bar">
    <div>
      <span>录入人员：</span><strong id="user-name">--</strong>
      <span style="margin-left: 15px;">工作单位：</span><strong id="user-company">--</strong>
    </div>
    <button class="btn-logout" onclick="logout()">退出登录</button>
  </div>

  <!-- 页签导航 -->
  <div class="admin-nav">
    <div class="admin-nav-item active" id="tab-nav-form" onclick="switchTab('form')">信息录入</div>
    <div class="admin-nav-item" id="tab-nav-history" onclick="switchTab('history')">历史记录</div>
  </div>

  <!-- 信息录入容器 -->
  <div id="tab-content-form" style="width: 100%; max-width: 650px;">
    <div class="glass-container form-container" style="margin-top: 0; max-width: 100%;">
      <h2 id="form-title">培训人员信息录入</h2>
      <p class="subtitle">请准确填写您的真实信息并上传照片</p>

      <div class="alert alert-error" id="error-alert"></div>
      <div class="alert alert-success" id="success-alert"></div>

      <form id="form-record" onsubmit="handleSubmit(event)" novalidate>
        <!-- 新增：身份证识别录入 -->
        <div class="form-group">
          <div class="form-grid" style="grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; max-width: 100%;">
            <div style="position: relative; width: 100%;">
              <button type="button" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 600; font-size: 0.95rem; display: flex; justify-content: center; align-items: center; gap: 8px;" onclick="toggleIdCardChoice()">🪪 身份证识别录入</button>
              <div id="idcard-choice-popup" style="display: none; position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px; background: rgba(35,35,40,0.97); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.5); backdrop-filter: blur(12px);">
                <button type="button" style="width: 100%; padding: 14px; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.08); color: #e0e0e0; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-align: center;" onclick="hideIdCardChoice(); document.getElementById('idcard-file-input').click();">📷 拍照</button>
                <button type="button" style="width: 100%; padding: 14px; background: transparent; border: none; color: #e0e0e0; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-align: center;" onclick="hideIdCardChoice(); document.getElementById('idcard-album-input').click();">📂 从相册选择</button>
              </div>
            </div>
            <input type="file" id="idcard-file-input" accept="image/*" capture="environment" style="display: none;" onchange="handleIdCardFile(event)">
            <input type="file" id="idcard-album-input" accept="image/*" style="display: none;" onchange="handleIdCardFile(event)">
            
            <div id="idcard-preview-container" style="display: none; align-items: center; gap: 12px; padding: 10px; background: rgba(255,255,255,0.02); border: 1px dashed var(--glass-border); border-radius: 8px; width: 100%;">
              <img id="idcard-preview-img" src="" style="width: 100px; height: 63px; object-fit: contain; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);">
            </div>
            <input type="hidden" id="id_card_img_path">
          </div>
        </div>

        <!-- 第一行：主照片与两组现场照片 -->
        <div class="form-group">
          <div class="photo-uploader-row">

  <script>
    function getSessionItem(key) {
      return sessionStorage.getItem(key) || localStorage.getItem(key);
    }

    const token = getSessionItem('token');
    const expires = localStorage.getItem('token_expires');

    // 鉴权，必须为有效会话且未过期
    if (!token || (localStorage.getItem('token') && expires && Number(expires) < Date.now())) {
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = '/login';
    }

    // 统一处理 401 响应：清 session + 友好提示 + 跳登录页
    function handleAuthFail(response, result) {
      if (response.status === 401) {
        const msg = (result && result.detail) ? result.detail : '登录已失效，请重新登录';
        showAlert('error', msg);
        setTimeout(() => {
          localStorage.clear();
          sessionStorage.clear();
          window.location.href = '/login';
        }, 1500);
        return true;
      }
      return false;
    }



    let userSavedFields = null; // 缓存服务端回填字段

    // 异步加载用户数据与上一次填写的字段
    async function fetchUserStatus() {
      try {
        const response = await fetch('/api/user/status', {
          headers: { 'Authorization': token }
        });
        const result = await response.json();
        if (response.ok && result.code === 200) {
          const userData = result.data;
          // 渲染头部信息
          document.getElementById('user-name').innerText = userData.real_name || '--';
          document.getElementById('user-company').innerText = userData.company || '--';
          // 同步 App Header 用户名
          const appUserName = document.getElementById('app-user-name');
          if (appUserName) appUserName.innerText = (userData.real_name || '--') + ' · ' + (userData.company || '--');
          
          // 缓存并回填字段（地址、岗位、区域）
          userSavedFields = userData.saved_fields;
          fillSavedFields();
        }
      } catch (err) {
        console.error('获取用户信息失败', err);
      }
    }

    // 回填被自动保存的字段
    function fillSavedFields() {
      if (userSavedFields) {
        if (userSavedFields.address) document.getElementById('address').value = userSavedFields.address;
        if (userSavedFields.job) document.getElementById('job').value = userSavedFields.job;
        if (userSavedFields.region_auth) document.getElementById('region_auth').value = userSavedFields.region_auth;
      }
    }

    async function loadRegions() {
      try {
        const response = await fetch('/api/regions');
        const result = await response.json();
        if (response.ok && result.code === 200) {
          const regionSelect = document.getElementById('region_auth');
          regionSelect.innerHTML = '<option value="" disabled selected>请选择区域权限</option>';
          result.regions.forEach(region => {
            const opt = document.createElement('option');
            opt.value = region;
            opt.text = region;
            regionSelect.appendChild(opt);
          });
          fillSavedFields();

      } catch (err) {
        console.error('加载区域权限失败', err);
      }
    }

    // 动态加载岗位/工种列表
    async function loadJobTypes() {
      try {
        const response = await fetch('/api/job_types');
        const result = await response.json();
        if (response.ok && result.code === 200 && result.job_types) {
          const jobSelect = document.getElementById('job');
          jobSelect.innerHTML = '<option value="" disabled selected>请选择岗位/工种</option>';
          result.job_types.forEach(job => {

            jobSelect.appendChild(opt);

    // 初始化获取用户信息与区域列表
    (async () => {
      await loadRegions();
      await loadJobTypes();
      await fetchUserStatus();

    let compressedPhotoBlob = null;
    let compressedPhotoFilename = 'photo.jpg';
    let sitePhotoGroups = [[], []];
    let removedSitePhotoPaths = [];
    let currentEditRecordId = null;
    let historyData = [];
    const selectedHistoryRecordIds = new Set();

    function compressImageFile(file, minSizeKB, maxSizeKB, callback) {
      if (typeof maxSizeKB === 'function') {
        callback = maxSizeKB;
        maxSizeKB = minSizeKB;
        minSizeKB = 0;
      }

      if (!file.type.startsWith('image/')) {
        showAlert('error', '所选文件不是有效的图片！');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          let scale = 1.0;
          const MAX_PIXELS = 1600;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > MAX_PIXELS) {
              h = Math.round((h * MAX_PIXELS) / w);
              w = MAX_PIXELS;
            }
          } else {
            if (h > MAX_PIXELS) {
              w = Math.round((w * MAX_PIXELS) / h);
              h = MAX_PIXELS;
            }
          }

          let canvas = document.createElement('canvas');
          let ctx = canvas.getContext('2d');
          let bestBlob = null;
          const minBytes = minSizeKB * 1024;
          const maxBytes = maxSizeKB * 1024;

          // 尺寸缩放迭代（最多尝试 4 次尺寸调整）
          for (let sAttempt = 0; sAttempt < 4; sAttempt++) {
            canvas.width = w * scale;
            canvas.height = h * scale;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            let lowQ = 0.05;
            let highQ = 1.0;
            let localBestBlob = null;

            // 质量二分法迭代（尝试 7 次，可精确到 1% 左右 of quality difference）
            for (let qAttempt = 0; qAttempt < 7; qAttempt++) {
              const quality = (lowQ + highQ) / 2;
              const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));

              if (blob.size >= minBytes && blob.size <= maxBytes) {
                callback(blob);
                return;
              }

              localBestBlob = blob;

              if (blob.size > maxBytes) {
                highQ = quality; // 太大了，降低质量
              } else {
                lowQ = quality;  // 太小了，提升质量
              }
            }

            bestBlob = localBestBlob;

            // 根据二分结果微调尺寸比例
            if (localBestBlob.size > maxBytes) {
              scale *= 0.75; // 质量降到最低依然超标，缩小尺寸再试
            } else if (localBestBlob.size < minBytes) {
              if (scale >= 2.0) break; // 防止无限放大
              scale *= 1.4;  // 质量满格依然不够，放大尺寸再试（针对背景极简单的图）
            }
          }

          // 兜底返回最接近目标区间的 Blob
          callback(bestBlob);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    let alertTimeout = null;
    let alertFadeTimeout = null;
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');

    function showAlert(type, msg) {
      clearTimeout(alertTimeout);
      clearTimeout(alertFadeTimeout);

      errorAlert.style.display = 'none';
      errorAlert.style.opacity = '1';
      successAlert.style.display = 'none';
      successAlert.style.opacity = '1';

      const targetAlert = (type === 'error') ? errorAlert : successAlert;
      targetAlert.innerText = msg;
      targetAlert.style.display = 'block';

      // 2秒后开始淡出，2.5秒时完全隐藏
      alertTimeout = setTimeout(() => {
        targetAlert.style.opacity = '0';
        alertFadeTimeout = setTimeout(() => {
          targetAlert.style.display = 'none';
          targetAlert.style.opacity = '1';
        }, 500);
      }, 2000);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 页签切换逻辑
    let activeTab = 'form';
    // 页签标题映射（用于 App Header 显示）
    const tabTitleMap = { form: '信息录入', history: '历史记录' };
    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-nav-form').classList.remove('active');
      document.getElementById('tab-nav-history').classList.remove('active');
      // 同步 App 底部 Tab Bar 激活状态
      ['form', 'history'].forEach(t => {
        const el = document.getElementById('app-tab-' + t);
        if (el) el.classList.toggle('active', t === tab);
      });
      // 同步 App Header 页面标题
      const pageTitleEl = document.getElementById('app-page-name');
      if (pageTitleEl && tabTitleMap[tab]) pageTitleEl.innerText = tabTitleMap[tab];

      document.getElementById('tab-content-form').style.display = 'none';
      document.getElementById('tab-content-history').style.display = 'none';
      if (tab === 'form') {
        document.getElementById('tab-nav-form').classList.add('active');
        document.getElementById('tab-content-form').style.display = 'block';
      } else if (tab === 'history') {
        document.getElementById('tab-nav-history').classList.add('active');
        document.getElementById('tab-content-history').style.display = 'block';
        loadHistory();
      }

      // 滚动到顶部，模拟 App 切页体验
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 考试/探伤页面返回时带 tab=history，始终重新请求接口而不是复用浏览器返回缓存。
    function refreshHistoryAfterWorkflow() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('tab') === 'history') {
        switchTab('history');
        window.history.replaceState({}, '', window.location.pathname);
      } else if (activeTab === 'history') {
        loadHistory();
      }
    }

    let historySearchTimeout = null;

    function getHistorySitePhotoGroups(value) {
      try {
        const groups = JSON.parse(value || '{}');
        return {
          welderCertificate: Array.isArray(groups['1']) ? groups['1'] : [],
          specialOperationCertificate: Array.isArray(groups['2']) ? groups['2'] : []
        };
      } catch (err) {
        return { welderCertificate: [], specialOperationCertificate: [] };
      }
    }

    function toHistoryPhotoUrl(path) {
      return '/' + String(path || '').replace(/\\/g, '/');
    }

    function renderHistoryPhotoItem(label, photoUrls) {
      const photoList = encodeURIComponent(JSON.stringify(photoUrls));
      const content = photoUrls.length
        ? photoUrls.map((url, index) => `
            <button type="button" class="history-photo-button" data-photo-list="${photoList}" data-photo-index="${index}" onclick="previewImageFromButton(this)">
              <img src="${escapeHtml(url)}" alt="${escapeHtml(label)}" onerror="this.closest('.history-photo-button').remove()">
            </button>
          `).join('')
        : '<span class="history-photo-empty">暂无照片</span>';
      return `<div class="history-photo-item"><span class="history-photo-label">${escapeHtml(label)}</span><div class="history-photo-images">${content}</div></div>`;
    }

    function getHistoryAssessmentPhotoUrls(value) {
      try {
        return JSON.parse(value || '[]')
          .filter(path => typeof path === 'string' && path)
          .map(toHistoryPhotoUrl);
      } catch (err) {
        return [];
      }
    }

    function detailPhotoGroup(label, photoUrls) {
      const content = photoUrls.length

    function historyExamSummary(row) {

    function saveClientBlobForDownload(blob, filename) {
      const downloader = window.HangongDownloader;
      if (downloader && typeof downloader.beginDownload === 'function') {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          let transferId = '';
          reader.onerror = () => reject(new Error('文件读取失败'));
          reader.onload = () => {
            try {
              const dataUrl = String(reader.result || '');
              const base64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
              transferId = downloader.beginDownload(filename, blob.type || 'application/octet-stream');
              if (!transferId) throw new Error('无法创建下载任务');
              const chunkSize = 60 * 1024;
              for (let offset = 0; offset < base64.length; offset += chunkSize) {
                if (downloader.appendDownloadChunk(transferId, base64.slice(offset, offset + chunkSize)) !== true) {
                  throw new Error('文件传输失败');
                }
              }
              if (downloader.finishDownload(transferId) !== true) throw new Error('文件保存失败');
              resolve();
            } catch (error) {
              if (transferId && typeof downloader.cancelDownload === 'function') downloader.cancelDownload(transferId);
              reject(error);
            }
          };
          reader.readAsDataURL(blob);
        });
      }
      const blobUrl = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = blobUrl;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 0);
      return Promise.resolve();
    }

    async function downloadInfoCard(recordId, silent = false) {
      const token = getSessionItem('token');
      if (!token) {
        showAlert('error', '登录已失效，请重新登录');
        setTimeout(() => window.location.href = '/login', 1500);
        return;
      }
      try {
        const response = await fetch(`/api/record/download_info_card/${recordId}`, {
          headers: { 'Authorization': token }
        });
        if (!response.ok) throw new Error('下载失败，请稍后重试');
        const contentDisposition = response.headers.get('content-disposition') || '';
        const filenameMatch = contentDisposition.match(/filename\*=utf-8''([^;]+)/i);
        const filename = filenameMatch ? decodeURIComponent(filenameMatch[1]) : '信息卡.pdf';
        await saveClientBlobForDownload(await response.blob(), filename);
        if (!silent) showAlert('success', '信息卡已保存到下载目录');
      } catch (error) {
        if (!silent) showAlert('error', error.message || '下载失败，请稍后重试');
      }
    }

    // 分享/发送登记卡链接
    function shareDownloadLink(recordId) {
      const token = getSessionItem('token');
      const url = `${window.location.protocol}//${window.location.host}/api/record/download_info_card/${recordId}?token=${encodeURIComponent(token)}`;
      
      const ua = navigator.userAgent.toLowerCase();
      const isWeixin = ua.indexOf('micromessenger') !== -1;
      
      if (isWeixin) {
        // 在微信浏览器内，直接弹出引导遮罩，指引用户点右上角三个点分享给朋友/文件传输助手
        document.getElementById('weixin-share-overlay').style.display = 'block';
      } else if (navigator.share) {
        // 在支持 Web Share API 的手机自带浏览器中，直接调起系统分享
        navigator.share({
          title: '人员登记卡',
          text: '这是人员登记卡文件，点击链接即可下载。',
          url: url
        }).catch(err => {
          fallbackCopyText(url);
        });
      } else {
        fallbackCopyText(url);
      }
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      // 避免屏幕滚动
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.position = "fixed";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          alert("下载链接已成功复制！\n你可以直接去微信粘贴发送给“文件传输助手”。");
        } else {
          alert("复制失败，请手动长按复制地址：" + text);
        }
      } catch (err) {
        alert("复制失败，请手动长按复制地址：" + text);
      }
      document.body.removeChild(textArea);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      const text = String(str);
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    }

    function editRecord(id) {
      const record = historyData.find(r => r.id === id);
      if (!record) return;

      currentEditRecordId = id;

      // 回填表单数据
      const nameField = document.getElementById('name');
      const idCardField = document.getElementById('id_card');
      
      nameField.disabled = false;
      nameField.style.opacity = '';
      nameField.style.cursor = '';
      nameField.placeholder = '请输入姓名';
      
      idCardField.disabled = false;
      idCardField.style.opacity = '';
      idCardField.style.cursor = '';
      idCardField.placeholder = '请输入18位身份证号';

      nameField.value = record.name;
      idCardField.value = record.id_card;
      document.getElementById('phone').value = record.phone;
      document.getElementById('address').value = record.address;
      document.getElementById('exam_project').value = record.exam_project || '';
      document.getElementById('certificate_work_item').value = record.certificate_work_item || '';
      document.getElementById('certificate_expiry').value = record.certificate_expiry || '';
      document.getElementById('welder_code').value = record.welder_code || '';
      document.getElementById('team').value = record.team || '';
      // 动态处理 job 选项以支持历史脏数据的兼容回填
      const jobSelect = document.getElementById('job');
      const jobVal = record.job;
      
      // 清理之前编辑可能遗留的临时 option
      const tempJobOption = jobSelect.querySelector('option[data-temp="true"]');
      if (tempJobOption) {
        tempJobOption.remove();
      }

      let jobExists = false;
      for (let i = 0; i < jobSelect.options.length; i++) {
        if (jobSelect.options[i].value === jobVal) {
          jobExists = true;
          break;
        }
      }
      if (!jobExists && jobVal) {
        const opt = document.createElement('option');
        opt.value = jobVal;
        opt.text = jobVal + ' (历史数据)';
        opt.setAttribute('data-temp', 'true');
        jobSelect.appendChild(opt);
      }
      jobSelect.value = jobVal;

      // 动态处理 region_auth 选项以支持历史脏数据的兼容回填
      const regionSelect = document.getElementById('region_auth');
      const val = record.region_auth;
      
      // 清理之前编辑可能遗留的临时 option
      const tempOption = regionSelect.querySelector('option[data-temp="true"]');
      if (tempOption) {
        tempOption.remove();
      }

      let exists = false;
      for (let i = 0; i < regionSelect.options.length; i++) {
        if (regionSelect.options[i].value === val) {
          exists = true;
          break;
        }
      }
      if (!exists && val) {
        const opt = document.createElement('option');
        opt.value = val;
        opt.text = val + ' (历史数据)';
        opt.setAttribute('data-temp', 'true');
        regionSelect.appendChild(opt);
      }
      regionSelect.value = val;

      // 回填照片预览
      const placeholder = document.getElementById('uploader-placeholder');
      const preview = document.getElementById('photo-preview');
      preview.src = '/' + record.photo_path;
      preview.style.display = 'block';
      placeholder.style.display = 'none';
      compressedPhotoBlob = null;
      compressedPhotoFilename = 'photo.jpg';
      loadSavedSitePhotos(record.site_photo_paths);

      placeholder.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <p>重新拍摄真人照片/非身份证照（不选则保持原图）</p>
      `;

      // 回填身份证图片预览
      const idcardPreviewContainer = document.getElementById('idcard-preview-container');
      const idcardPreviewImg = document.getElementById('idcard-preview-img');
      const idcardImgPathInput = document.getElementById('id_card_img_path');
      idcardImgPathInput.value = '';
      if (record.id_card) {
        idcardPreviewImg.src = '/uploads/idcards/' + record.id_card + '.png?token=' + encodeURIComponent(getSessionItem('token') || '');
        idcardPreviewImg.onerror = function() {
          idcardPreviewContainer.style.display = 'none';
        };
        idcardPreviewContainer.style.display = 'flex';
      } else {
        idcardPreviewContainer.style.display = 'none';
      }

      // UI文案微调
      document.getElementById('form-title').innerText = '修改培训人员信息';
      document.getElementById('btn-submit').innerText = '保 存 修 改 信 息';
      document.getElementById('btn-cancel-edit').style.display = 'block';

      switchTab('form');
    }

      nameField.style.cursor = 'not-allowed';

    // 模态框预览大图
    let previewPhotos = [];
    let previewPhotoIndex = 0;
    function updatePreviewImage() {
      const modalImg = document.getElementById('modal-img');
      const multiple = previewPhotos.length > 1;
      modalImg.src = previewPhotos[previewPhotoIndex] || '';
      document.getElementById('image-prev').style.display = multiple ? 'block' : 'none';
      document.getElementById('image-next').style.display = multiple ? 'block' : 'none';
      const counter = document.getElementById('image-counter');
      counter.style.display = multiple ? 'block' : 'none';
      counter.textContent = `${previewPhotoIndex + 1} / ${previewPhotos.length}`;
    }
    function previewImage(src, photos = [src], index = 0) {
      const modal = document.getElementById('image-modal');
      previewPhotos = (Array.isArray(photos) ? photos : [src]).filter(Boolean);
      previewPhotoIndex = Math.max(0, previewPhotos.indexOf(src));
      if (Number.isInteger(index) && index >= 0 && index < previewPhotos.length) previewPhotoIndex = index;
      modal.style.display = 'flex';
      updatePreviewImage();
    }
    function previewImageFromButton(button) {
      const photoList = button.dataset.photoList;
      if (photoList) {
        try {
          const photos = JSON.parse(decodeURIComponent(photoList)).filter(Boolean);
          const index = Number(button.dataset.photoIndex) || 0;
          if (photos.length) {
            previewImage(photos[index] || button.querySelector('img').currentSrc || button.querySelector('img').src, photos, index);
            return;
          }
        } catch (_) { /* Fall back to the visible photo group. */ }
      }
      const images = Array.from(button.parentElement.querySelectorAll('img')).map(image => image.currentSrc || image.src).filter(Boolean);
      previewImage(button.querySelector('img').currentSrc || button.querySelector('img').src, images, Array.from(button.parentElement.querySelectorAll('button')).indexOf(button));
    }
    function changePreviewImage(step) {
      if (previewPhotos.length < 2) return;
      previewPhotoIndex = (previewPhotoIndex + step + previewPhotos.length) % previewPhotos.length;
      updatePreviewImage();
    }

    function closeModal() {
      document.getElementById('image-modal').style.display = 'none';
    }
    (() => {
      let startX = null;
      const modal = document.getElementById('image-modal');
      modal.addEventListener('touchstart', event => { startX = event.changedTouches[0].clientX; }, { passive: true });
      modal.addEventListener('touchend', event => {
        if (startX === null) return;
        const distance = event.changedTouches[0].clientX - startX;
        startX = null;
        if (Math.abs(distance) >= 42) changePreviewImage(distance < 0 ? 1 : -1);
      }, { passive: true });
    })();

    function originalImageFilename(file, fallback) {
      return /\.(jpe?g|png|gif)$/i.test(file.name || '') ? file.name : fallback;
    }

    function handlePhotoChange(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showAlert('error', '所选文件不是有效的图片！');
        return;
      }

      const placeholder = document.getElementById('uploader-placeholder');
      const preview = document.getElementById('photo-preview');
      placeholder.innerHTML = '<p>正在处理照片...</p>';
      compressImageFile(file, 300, (blob) => {
        if (!blob) { showAlert('error', '照片压缩失败，请重新选择。'); return; }
        compressedPhotoBlob = blob;
        compressedPhotoFilename = 'photo.jpg';
        preview.src = URL.createObjectURL(blob);
        preview.style.display = 'block';
        placeholder.style.display = 'none';
        showAlert('success', '照片已添加');
      });
    }

    function renderSitePhotoGroup(groupIndex) {
      const photos = sitePhotoGroups[groupIndex];
      const preview = document.getElementById(`site-photo-preview-${groupIndex + 1}`);
      const placeholder = document.getElementById(`site-photo-placeholder-${groupIndex + 1}`);
      preview.innerHTML = photos.map((photo, photoIndex) => `
        <div class="multi-photo-thumbnail">
          <img src="${photo.url}" alt="现场照片 ${photoIndex + 1}">
          <button type="button" class="multi-photo-remove" aria-label="删除照片" onclick="removeSitePhoto(${groupIndex}, ${photoIndex}, event)">×</button>
        </div>
      `).join('');
      placeholder.style.display = photos.length ? 'none' : 'flex';
    }

    function removeSitePhoto(groupIndex, photoIndex, event) {
      event.stopPropagation();
      const [removed] = sitePhotoGroups[groupIndex].splice(photoIndex, 1);
      if (removed?.path) removedSitePhotoPaths.push(removed.path);
      if (removed?.blob) URL.revokeObjectURL(removed.url);
      renderSitePhotoGroup(groupIndex);
    }

    function resetSitePhotos() {
      sitePhotoGroups.flat().filter(photo => photo.blob).forEach(photo => URL.revokeObjectURL(photo.url));
      sitePhotoGroups = [[], []];
      removedSitePhotoPaths = [];
      renderSitePhotoGroup(0);
      renderSitePhotoGroup(1);
    }

    function loadSavedSitePhotos(value) {
      resetSitePhotos();
      try {
        const savedGroups = JSON.parse(value || '{}');
        [0, 1].forEach(groupIndex => {
          const paths = savedGroups[String(groupIndex + 1)];
          if (!Array.isArray(paths)) return;
          sitePhotoGroups[groupIndex] = paths
            .filter(path => typeof path === 'string' && path)
            .map(path => ({ path, url: '/' + path.replace(/\\/g, '/') }));
          renderSitePhotoGroup(groupIndex);
        });
      } catch (err) {
        console.warn('现场照片记录格式无效', err);
      }
    }

    function prepareSitePhoto(file) {
      if (!file.type.startsWith('image/')) {
        return Promise.reject(new Error('所选文件不是有效的图片'));
      }
      return new Promise((resolve, reject) => {
        compressImageFile(file, 300, (blob) => {
          if (!blob) { reject(new Error('照片压缩失败，请重新选择')); return; }
          resolve(blob);
        });
      });
    }

    async function handleSitePhotos(event, groupIndex) {
      const files = Array.from(event.target.files || []);
      event.target.value = '';
      if (!files.length) return;

      const placeholder = document.getElementById(`site-photo-placeholder-${groupIndex + 1}`);
      placeholder.style.display = 'flex';
      placeholder.innerHTML = '<p>正在处理照片...</p>';

      try {
        for (const file of files) {
          const blob = await prepareSitePhoto(file);
          sitePhotoGroups[groupIndex].push({ blob, filename: 'site_photo.jpg', url: URL.createObjectURL(blob) });
        }
        renderSitePhotoGroup(groupIndex);
        showAlert('success', `现场照片已添加 ${files.length} 张`);
      } catch (err) {
        renderSitePhotoGroup(groupIndex);
        showAlert('error', err.message || '现场照片读取失败，请重试');
      }
    }

    function validateRecordForm() {
      const fields = [
        ['name', '姓名'], ['id_card', '身份证号'], ['phone', '联系电话'], ['address', '常住地址'],
        ['job', '岗位/工种'], ['region_auth', '区域权限'], ['team', '班组'], ['exam_project', '考试项目'],
        ['certificate_work_item', '证件作业项'], ['certificate_expiry', '证件有效期'], ['welder_code', '焊工代号']
      ].map(([id, label]) => ({ id, label, element: document.getElementById(id) }));
      const missing = fields.filter(({ element }) => !element || !String(element.value || '').trim());
      fields.forEach(({ element }) => { if (element) element.classList.remove('field-missing'); });
      if (!missing.length) return true;

      missing.forEach(({ element }) => { if (element) element.classList.add('field-missing'); });
      showAlert('error', `请填写以下必填项：${missing.map(({ label }) => label).join('、')}`);
      const first = missing[0] && missing[0].element;
      if (first) {
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (!first.disabled) first.focus({ preventScroll: true });
      }
      return false;
    }

    async function handleSubmit(e) {
      e.preventDefault();

      if (!validateRecordForm()) return;
      
      if (currentEditRecordId === null && !compressedPhotoBlob) {
        showAlert('error', '请先上传您的照片！');
        return;
      }

      const idCard = document.getElementById('id_card').value.trim();
      if (idCard.length !== 18 || (idCard[10] !== '0' && idCard[10] !== '1')) {
        showAlert('error', '身份证号格式不正确（必须为18位且第11位是0或1）！');
        return;
      }

      const formData = new FormData();
      formData.append('name', document.getElementById('name').value);
      formData.append('id_card', idCard);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('address', document.getElementById('address').value);
      formData.append('job', document.getElementById('job').value);
      formData.append('region_auth', document.getElementById('region_auth').value);
      formData.append('exam_project', document.getElementById('exam_project').value);
      formData.append('certificate_work_item', document.getElementById('certificate_work_item').value);
      formData.append('certificate_expiry', document.getElementById('certificate_expiry').value);
      formData.append('welder_code', document.getElementById('welder_code').value);
      formData.append('team', document.getElementById('team').value);
      formData.append('id_card_img_path', document.getElementById('id_card_img_path').value);
      
      if (compressedPhotoBlob) {
        formData.append('photo', compressedPhotoBlob, compressedPhotoFilename);
      }
      sitePhotoGroups.forEach((photos, groupIndex) => {
        photos.forEach((photo, photoIndex) => {
          if (photo.blob) {
            formData.append(`site_photo_group_${groupIndex + 1}`, photo.blob, photo.filename || `site_photo_${groupIndex + 1}_${photoIndex + 1}.jpg`);
          }
        });
      });
      if (removedSitePhotoPaths.length) {
        formData.append('removed_site_photo_paths', JSON.stringify(removedSitePhotoPaths));
      }

      let url = '/api/record';
      if (currentEditRecordId !== null) {
        url = '/api/record/update';
        formData.append('record_id', currentEditRecordId);
      }

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Authorization': token
          },
          body: formData
        });

        const result = await response.json();
        if (handleAuthFail(response, result)) { submitBtn.disabled = false; submitBtn.innerText = currentEditRecordId ? '确 认 修 改 信 息' : '确 认 提 交 信 息'; return; }
        if (response.ok) {
          const isEdit = currentEditRecordId !== null;
          showAlert('success', isEdit ? '修改信息成功！' : '提交录入信息成功！');
          
          userSavedFields = {
            address: document.getElementById('address').value,
            job: document.getElementById('job').value,
            region_auth: document.getElementById('region_auth').value
          };

          currentEditRecordId = null;
          document.getElementById('form-title').innerText = '培训人员信息录入';
          document.getElementById('btn-submit').innerText = '确 认 提 交 信 息';
          document.getElementById('btn-cancel-edit').style.display = 'none';

          document.getElementById('form-record').reset();
          
          // 重新禁用
          const nameField = document.getElementById('name');
          const idCardField = document.getElementById('id_card');
          
          nameField.disabled = true;
          nameField.style.opacity = '0.6';
          nameField.style.cursor = 'not-allowed';
          nameField.placeholder = '请先进行身份证识别';
          
          idCardField.disabled = true;
          idCardField.style.opacity = '0.6';
          idCardField.style.cursor = 'not-allowed';
          idCardField.placeholder = '请先进行身份证识别';
          
          // 重置身份证识别区域
          document.getElementById('id_card_img_path').value = '';
          document.getElementById('idcard-preview-container').style.display = 'none';
          document.getElementById('idcard-preview-img').src = '';
          
          const jobSelect = document.getElementById('job');
          const tempJobOption = jobSelect.querySelector('option[data-temp="true"]');
          if (tempJobOption) {
            tempJobOption.remove();
          }

          const regionSelect = document.getElementById('region_auth');
          const tempOption = regionSelect.querySelector('option[data-temp="true"]');
          if (tempOption) {
            tempOption.remove();
          }
          
          compressedPhotoBlob = null;
          compressedPhotoFilename = 'photo.jpg';
          resetSitePhotos();
          document.getElementById('photo-preview').style.display = 'none';
          const placeholder = document.getElementById('uploader-placeholder');
          placeholder.style.display = 'flex';
          placeholder.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <p>拍摄真人照片/非身份证照</p>
          `;
          
          fillSavedFields();



          // 每次保存后都刷新历史缓存，切到历史页即可立即看到最新记录。
          await loadHistory();
        } else {
          showAlert('error', result.detail || '提交录入数据失败，请重试');
        }
      } catch (err) {
        showAlert('error', '网络连接错误，无法提交');
      }
    }

    function logout() {
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = '/login';
    }

    function closePhotoSourceChoices() {
      document.querySelectorAll('.photo-source-menu.is-open').forEach(menu => menu.classList.remove('is-open'));
    }

    function openPhotoSourceChoice(event, photoType) {
      if (event.target.closest('.multi-photo-remove')) return;
      const menu = document.getElementById(`photo-source-menu-${photoType}`);
      if (!menu) return;
      const isOpen = menu.classList.contains('is-open');
      closePhotoSourceChoices();
      if (!isOpen) menu.classList.add('is-open');
    }

    function choosePhotoSource(photoType, source) {
      const inputIds = {
        headshot: { camera: 'photo-camera-input', album: 'photo-input' },
        'welder-certificate': { camera: 'site-photo-camera-input-1', album: 'site-photo-input-1' },
        'special-certificate': { camera: 'site-photo-camera-input-2', album: 'site-photo-input-2' }
      };
      const inputId = inputIds[photoType] && inputIds[photoType][source];
      const input = inputId ? document.getElementById(inputId) : null;
      closePhotoSourceChoices();
      if (input) input.click();
    }

    // 身份证拍照/选择：按钮下方弹出选择菜单
    function toggleIdCardChoice() {
      const popup = document.getElementById('idcard-choice-popup');
      popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
    }
    function hideIdCardChoice() {
      document.getElementById('idcard-choice-popup').style.display = 'none';
    }
    document.addEventListener('click', function(e) {
      const popup = document.getElementById('idcard-choice-popup');
      if (popup && popup.style.display !== 'none' && !e.target.closest('#idcard-choice-popup') && !e.target.closest('[onclick*="toggleIdCardChoice"]')) {
        popup.style.display = 'none';
      }
      if (!e.target.closest('.photo-uploader')) closePhotoSourceChoices();
    });
    // HTTP 环境下无法使用 getUserMedia，所有裁切由服务端完成

    function handleIdCardFile(event) {
      const file = event.target.files[0];
      if (file) {
        // 开始新识别前，清空旧的数据并重新禁用，避免残留旧信息
        document.getElementById('name').value = '';
        document.getElementById('name').disabled = true;
        document.getElementById('name').style = 'background: #3a3a4a; color: #888; cursor: not-allowed;';
        document.getElementById('name').placeholder = '请先进行身份证识别';
        
        document.getElementById('id_card').value = '';
        document.getElementById('id_card').disabled = true;
        document.getElementById('id_card').style = 'background: #3a3a4a; color: #888; cursor: not-allowed;';
        document.getElementById('id_card').placeholder = '请先进行身份证识别';
        
        document.getElementById('id_card_img_path').value = '';
        document.getElementById('idcard-preview-container').style.display = 'none';
        document.getElementById('idcard-preview-img').src = '';

        const submitBtn = document.getElementById('btn-submit');
        submitBtn.disabled = true;
        submitBtn.innerText = '正在处理身份证图片...';
        compressImageFile(file, 300, (blob) => {
          uploadIdCardBlob(blob);
        });
      }
      event.target.value = '';
    }

    async function uploadIdCardBlob(blob) {
      const submitBtn = document.getElementById('btn-submit');
      submitBtn.disabled = true;
      submitBtn.innerText = '正在上传并识别身份证...';
      
      const formData = new FormData();
      formData.append('file', blob, 'idcard.jpg');
      
      try {
        const response = await fetch('/api/ocr_idcard', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        
        submitBtn.disabled = false;
        submitBtn.innerText = currentEditRecordId ? '确 认 修 改 信 息' : '确 认 提 交 信 息';
        
        if (response.ok && (result.name || result.id_card)) {
          // 解除禁用
          const nameField = document.getElementById('name');
          const idCardField = document.getElementById('id_card');
          
          nameField.disabled = false;
          nameField.style.opacity = '';
          nameField.style.cursor = '';
          nameField.placeholder = '请输入姓名';
          
          idCardField.disabled = false;
          idCardField.style.opacity = '';
          idCardField.style.cursor = '';
          idCardField.placeholder = '请输入18位身份证号';

          nameField.value = result.name || '';
          idCardField.value = result.id_card || '';
          
          document.getElementById('id_card_img_path').value = result.temp_id_card_img;
          
          const previewContainer = document.getElementById('idcard-preview-container');
          const previewImg = document.getElementById('idcard-preview-img');
          const serverPreviewUrl = '/' + result.temp_id_card_img + '?token=' + encodeURIComponent(getSessionItem('token') || '');
          // 部分内嵌浏览器会拦截带 token 的图片请求；保留本地压缩图作为即时预览兜底。
          previewImg.onerror = function() {
            previewImg.onerror = null;
            previewImg.src = URL.createObjectURL(blob);
          };
          previewImg.src = serverPreviewUrl;
          previewContainer.style.display = 'flex';
          
          showAlert('success', `身份证成功识别！已自动回填姓名：${result.name}`);
        } else {
          showAlert('error', '身份证识别失败，请确保光线充足且正面完整置于框内！');
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerText = currentEditRecordId ? '确 认 修 改 信 息' : '确 认 提 交 信 息';
        showAlert('error', '身份证上传识别失败，网络故障');
      }
    }
