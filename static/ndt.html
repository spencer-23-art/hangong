<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>探伤</title>
  <style>
    :root { --bg:#0f172a; --panel:#18233a; --line:rgba(255,255,255,.13); --text:#f8fafc; --muted:#94a3b8; --green:#22c55e; --blue:#3b82f6; }
    * { box-sizing:border-box; } html,body { width:100%; min-height:100%; margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; } body { display:flex; justify-content:center; }
    .page { width:100%; max-width:760px; min-height:100dvh; padding:calc(14px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); } .header { display:flex; align-items:center; gap:12px; margin-bottom:14px; } .back { width:38px; height:38px; border:1px solid var(--line); color:var(--text); background:rgba(255,255,255,.05); border-radius:9px; font-size:22px; cursor:pointer; } h1 { margin:0; font-size:20px; } .subtitle { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .photo-collection { display:flex; gap:10px; overflow-x:auto; padding:4px 2px 2px; min-height:92px; } .thumb,.add-photo { position:relative; width:82px; height:82px; flex:0 0 82px; overflow:hidden; border:1px solid var(--line); border-radius:9px; background:var(--panel); } .thumb img { display:block; width:100%; height:100%; object-fit:cover; } .thumb button { position:absolute; right:2px; top:2px; width:21px; height:21px; padding:0; border:0; border-radius:50%; background:rgba(0,0,0,.72); color:#fff; cursor:pointer; font-size:16px; line-height:18px; } .add-photo { display:flex; align-items:center; justify-content:center; border-style:dashed; color:var(--muted); font-size:36px; cursor:pointer; } .add-photo:disabled { opacity:.42; cursor:not-allowed; } .photo-hint { margin:8px 2px 0; color:var(--muted); font-size:13px; }
    .confirm,.complete { width:100%; margin-top:14px; min-height:47px; border-radius:10px; color:#fff; font-size:15px; font-weight:700; cursor:pointer; } .confirm { border:1px solid rgba(59,130,246,.6); background:rgba(59,130,246,.16); color:#dbeafe; } .ndt-result-actions { display:none; gap:10px; margin-top:14px; } .ndt-result-actions.visible { display:grid; grid-template-columns:1fr 1fr; } .complete { margin:0; border:1px solid rgba(34,197,94,.75); background:rgba(34,197,94,.18); } .complete.unqualified { border-color:rgba(239,68,68,.8); background:rgba(239,68,68,.18); } .confirm:disabled { opacity:.48; cursor:not-allowed; }
    .confirmed-note { display:none; margin-top:12px; color:#86efac; font-size:13px; text-align:center; } .notice { min-height:20px; margin:12px 0 0; font-size:13px; text-align:center; color:var(--muted); } .notice.error { color:#fca5a5; } .notice.success { color:#86efac; } .saving { position:fixed; inset:0; z-index:20; display:none; place-items:center; background:rgba(2,6,23,.72); padding:20px; } .saving.visible { display:grid; } .saving div { padding:20px 24px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
    .photo-source-choice { display:none; grid-template-columns:1fr 1fr; gap:10px; margin:10px 2px 0; }
    .photo-source-choice.visible { display:grid; }
    .photo-source-choice button { min-height:40px; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.06); color:var(--text); font-size:14px; cursor:pointer; }
  </style>
</head>
<body>
  <main class="page">
    <header class="header"><button class="back" type="button" aria-label="返回" onclick="goBack()">‹</button><div><h1>探伤</h1><p class="subtitle">点击“+”拍一张探伤照片，全部拍完后确认合格</p></div></header>
    <input id="photo-camera-input" type="file" accept="image/*" capture="environment" hidden>
    <input id="photo-album-input" type="file" accept="image/*" hidden>
    <div class="photo-collection" id="photo-collection"><button class="add-photo" id="capture-button" type="button" aria-label="拍摄探伤照片" disabled>+</button></div>
    <div class="photo-source-choice" id="photo-source-choice"><button type="button" id="choose-camera">📷 拍照</button><button type="button" id="choose-album">📂 从相册选择</button></div>
    <p class="photo-hint">探伤照片可重复添加多张，每张会压缩至 300KB 内。</p>
    <button class="confirm" id="confirm" type="button" disabled>确认本次探伤照片</button>
    <div class="confirmed-note" id="confirmed-note">照片已确认，请选择探伤结果。</div>
    <div class="ndt-result-actions" id="ndt-result-actions"><button class="complete" id="complete-qualified" type="button">合格</button><button class="complete unqualified" id="complete-unqualified" type="button">不合格</button></div><p class="notice" id="notice"></p>
  </main>
  <div class="saving" id="saving"><div>正在保存探伤记录，请稍候…</div></div>
  <script>
    const token = sessionStorage.getItem('token') || localStorage.getItem('token');
    const role = sessionStorage.getItem('role') || localStorage.getItem('role');
    const recordId = Number(new URLSearchParams(location.search).get('record_id'));
    const cameraInput = document.getElementById('photo-camera-input'); const albumInput = document.getElementById('photo-album-input'); const photoSourceChoice = document.getElementById('photo-source-choice'); const confirmButton = document.getElementById('confirm'); const resultActions = document.getElementById('ndt-result-actions'); const notice = document.getElementById('notice'); const photos = []; let confirmed = false;
    const setNotice = (message, type = '') => { notice.textContent = message; notice.className = `notice ${type}`; };
    function goBack() { history.length > 1 ? history.back() : location.replace('/client'); }
    function hidePhotoSourceChoice() { photoSourceChoice.classList.remove('visible'); }
    function bindCaptureButton() { const button = document.getElementById('capture-button'); if (button) button.addEventListener('click', () => { if (!confirmed) photoSourceChoice.classList.add('visible'); }); }
    function renderPhotos() { const collection = document.getElementById('photo-collection'); confirmButton.disabled = !photos.length || confirmed; collection.innerHTML = photos.map((photo, index) => `<div class="thumb"><img src="${photo.url}" alt="探伤照片 ${index + 1}"><button type="button" aria-label="删除第${index + 1}张照片" onclick="removePhoto(${index})">×</button></div>`).join('') + `<button class="add-photo" id="capture-button" type="button" aria-label="拍摄探伤照片" ${confirmed || photos.length >= 60 ? 'disabled' : ''}>+</button>`; bindCaptureButton(); }
    function removePhoto(index) { if (confirmed) return; const [removed] = photos.splice(index, 1); if (removed) URL.revokeObjectURL(removed.url); renderPhotos(); }
    async function loadImageSource(file) {
      if (typeof createImageBitmap === 'function') return createImageBitmap(file);
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => { image.__sourceUrl = url; resolve(image); };
        image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('照片读取失败，请重新拍摄')); };
        image.src = url;
      });
    }
    function releaseImageSource(source) { if (typeof source.close === 'function') source.close(); if (source.__sourceUrl) URL.revokeObjectURL(source.__sourceUrl); }
    async function prepareImageFile(file) {
      if (!file.type.startsWith('image/')) throw new Error('所选文件不是有效的图片');
      const source = await loadImageSource(file);
      const maxBytes = 300 * 1024;
      let scale = Math.max(source.width, source.height) > 1600 ? 1600 / Math.max(source.width, source.height) : 1;
      let bestBlob = null;
      for (let sizeAttempt = 0; sizeAttempt < 4; sizeAttempt++) {
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(source.width * scale));
        canvas.height = Math.max(1, Math.round(source.height * scale));
        canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
        let low = .05, high = 1;
        for (let qualityAttempt = 0; qualityAttempt < 8; qualityAttempt++) {
          const quality = (low + high) / 2;
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
          if (!blob) throw new Error('照片压缩失败，请重新拍摄');
          bestBlob = blob;
          if (blob.size <= maxBytes) { releaseImageSource(source); return blob; }
          high = quality;
        }
        scale *= .75;
      }
      releaseImageSource(source);
      if (!bestBlob) throw new Error('照片压缩失败，请重新拍摄');
      return bestBlob;
    }
    async function addPhoto(event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file || confirmed) return;
      if (photos.length >= 60) { setNotice('一次探伤最多拍摄60张照片。', 'error'); return; }
      const button = document.getElementById('capture-button');
      if (button) button.disabled = true;
      try {
        const blob = await prepareImageFile(file);
        photos.push({ blob, filename: 'ndt.jpg', url: URL.createObjectURL(blob) });
        renderPhotos();
        setNotice(`已添加第 ${photos.length} 张探伤照片（${Math.ceil(blob.size / 1024)}KB）。`, 'success');
      } catch (error) { setNotice(error.message || '拍摄失败，请重试。', 'error'); }
      finally {
        const latestButton = document.getElementById('capture-button');
        if (latestButton && !confirmed) latestButton.disabled = false;
      }
    }
    function confirmPhotos(){if(!photos.length)return;confirmed=true;renderPhotos();document.getElementById('confirmed-note').style.display='block';resultActions.classList.add('visible');setNotice(`已确认 ${photos.length} 张探伤照片。`,'success');}
    async function submitNdt(result){ const formData=new FormData(); formData.append('record_id',String(recordId)); formData.append('result',result); photos.forEach((photo,index)=>formData.append('photos',photo.blob,photo.filename||`ndt_${index+1}.jpg`));document.getElementById('saving').classList.add('visible');try{const response=await fetch('/api/welding-skill-exam/ndt',{method:'POST',headers:{Authorization:token},body:formData});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.detail||'探伤保存失败，请重试');setNotice(result==='qualified'?'探伤合格已保存。':'探伤不合格已保存。','success');setTimeout(()=>location.replace(`/client?tab=history&refresh=${Date.now()}`),900);}catch(error){setNotice(error.message||'探伤保存失败，请重试。','error');}finally{document.getElementById('saving').classList.remove('visible');}}
    if(!token||role==='admin'||!recordId||recordId<1){document.getElementById('capture-button').disabled=true;setNotice('探伤仅可由对应的注册用户从历史记录页面进入。','error');}else{document.getElementById('capture-button').disabled=false;bindCaptureButton();} document.getElementById('choose-camera').addEventListener('click',()=>{hidePhotoSourceChoice();cameraInput.click();});document.getElementById('choose-album').addEventListener('click',()=>{hidePhotoSourceChoice();albumInput.click();});cameraInput.addEventListener('change',addPhoto);albumInput.addEventListener('change',addPhoto);confirmButton.addEventListener('click',confirmPhotos);document.getElementById('complete-qualified').addEventListener('click',()=>submitNdt('qualified'));document.getElementById('complete-unqualified').addEventListener('click',()=>submitNdt('unqualified'));
  </script>
</body>
</html>
